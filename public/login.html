<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    <title>SillyTavern Login</title>
    <style>
        body { background-color: rgb(36, 36, 37); color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        .login-box { background-color: #222; padding: 30px; border-radius: 8px; border: 1px solid #444; width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #fff; font-size: 22px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #555; background: #333; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 90%; padding: 11px; background: #c1bd44; border: none; color: black; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 15px; margin-top: 10px; }
        button:hover { background: #a8a439; }
        .msg { margin-top: 15px; font-size: 14px; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 30px; border-radius: 8px; border: 2px solid #c1bd44; width: 300px; text-align: center; }
        .error-link { color: #c1bd44; text-decoration: underline; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Welcome to SillyTavern</h2>
        <p style="color:#aaa; font-size:14px; margin-bottom:20px;">Enter Login Details</p>
        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="text" id="username" placeholder="User handle" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <div id="login-status" class="msg"></div>
        
        <p style="margin-top: 20px; font-size: 14px;">
            Don't have an account? <a href="#" onclick="openRegistrationModal()" style="color: #c1bd44; text-decoration: none; font-weight: bold;">Register Here</a>
        </p>
    </div>

    <div id="reg-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:#fff; margin-top:0; margin-bottom:15px;">Create Account</h3>
            <input type="text" id="reg-user" placeholder="Desired Username">
            <input type="password" id="reg-pass" placeholder="Password">
            <button onclick="submitRegistration()">Register</button>
            <div id="reg-status" class="msg" style="color: yellow;"></div>
            <p><a href="#" onclick="document.getElementById('reg-modal').style.display='none'" style="color: #888; text-decoration: underline; font-size: 13px;">Cancel</a></p>
        </div>
    </div>

    <script>
    function openRegistrationModal() {
        document.getElementById('reg-modal').style.display = 'flex';
        document.getElementById('login-status').innerText = "";
    }

    async function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const status = document.getElementById('login-status');
        
        status.innerText = "";

        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle: user, password: pass })
            });
            
            if (response.ok) { 
                window.location.href = "/"; 
            } else if (response.status === 404) {
                status.style.color = "#ff4a4a";
                status.innerHTML = "Account not found. <span class='error-link' onclick='openRegistrationModal()'>Register here</span> to create it!";
            } else {
                status.style.color = "#ff4a4a";
                status.innerText = "Incorrect password. Please try again.";
            }
        } catch { 
            status.style.color = "#ff4a4a";
            status.innerText = "Error connecting to server."; 
        }
    }

    async function submitRegistration() {
        const user = document.getElementById('reg-user').value.trim();
        const pass = document.getElementById('reg-pass').value;
        const status = document.getElementById('reg-status');
        
        if(!user || !pass) { status.innerText = "Please fill in all fields."; return; }
        if(user.length < 3) { status.innerText = "Username too short."; return; }
        if(/[^a-zA-Z0-9]/.test(user)) { status.innerText = "Letters and numbers only."; return; }

        status.style.color = "yellow";
        status.innerText = "Creating account...";
        
        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Registration-Bypass': 'true' },
                body: JSON.stringify({ handle: user, password: pass, auto_create: true })
            });
            
            if (response.ok) {
                status.style.color = "green"; 
                status.innerText = "Success! Account generated.";
                setTimeout(() => { 
                    document.getElementById('reg-modal').style.display = 'none';
                    document.getElementById('username').value = user;
                    document.getElementById('password').value = "";
                    status.innerText = "";
                    document.getElementById('login-status').innerText = "";
                }, 1500);
            } else {
                const data = await response.json().catch(() => ({}));
                status.style.color = "red"; 
                status.innerText = data.error || "Registration failed. Try another name.";
            }
        } catch (err) { 
            status.style.color = "red"; 
            status.innerText = "Server communication error."; 
        }
    }
    </script>
</body>
</html>
